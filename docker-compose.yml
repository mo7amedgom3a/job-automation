services:
  job-dork-api:
    build:
      context: ./backend
    container_name: job-dork-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    environment:
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: postgresql://job_user:job_password@postgres:5432/job_automation
      REDIS_URL: redis://redis:6379/0
      CACHE_REQUIRE_REDIS: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - job_automation_net
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    container_name: job_automation_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: job_automation
      POSTGRES_USER: job_user
      POSTGRES_PASSWORD: job_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - job_automation_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U job_user -d job_automation"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: job_automation_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - job_automation_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5


volumes:
  postgres_data:
  redis_data:

networks:
  job_automation_net:
    driver: bridge
